<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- CUSTOMER NAVBAR FRAGMENT -->
<nav th:fragment="customerNavbar(activePage)" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom sticky-top py-2 px-3 app-navbar navbar-customer-theme">
    <div class="container">
        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center me-4 text-decoration-none" href="#" th:href="@{/customer/home}">
            <div class="brand-icon bg-primary text-white rounded-circle p-2 me-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
                <i class="bi bi-shield-check fs-5"></i>
            </div>
            <div>
                <span class="fw-bold text-dark fs-5">PAWN</span><span class="fw-bold text-primary fs-5">MASTER</span>
                <span class="d-block text-muted fs-8">Dịch vụ Cầm đồ & Thế chấp</span>
            </div>
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#customerNavbarContent" aria-controls="customerNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Menu Content -->
        <div class="collapse navbar-collapse" id="customerNavbarContent">
            <!-- Center Menu Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 gap-lg-2">
                <!-- Trang chủ -->
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'home' ? 'active bg-primary text-white shadow-sm' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/customer/home}">
                        <i class="bi bi-house-door me-1-5"></i> Trang chủ
                    </a>
                </li>
                <!-- Đăng ký cầm đồ -->
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'pawn-register' ? 'active bg-primary text-white shadow-sm' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/customer/pawn-register}">
                        <i class="bi bi-box-arrow-in-down me-1-5"></i> Đăng ký cầm đồ
                    </a>
                </li>
                <!-- Đăng ký khoản vay -->
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'loan-register' ? 'active bg-primary text-white shadow-sm' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/customer/loan-register}">
                        <i class="bi bi-cash-stack me-1-5"></i> Đăng ký khoản vay
                    </a>
                </li>
                <!-- Hợp đồng của tôi -->
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'my-contracts' ? 'active bg-primary text-white shadow-sm' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/customer/my-contracts}">
                        <i class="bi bi-file-earmark-check me-1-5"></i> Hợp đồng của tôi
                    </a>
                </li>
                <!-- Hồ sơ -->
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-pill fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'profile' ? 'active bg-primary text-white shadow-sm' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/customer/profile}">
                        <i class="bi bi-person-circle me-1-5"></i> Hồ sơ
                    </a>
                </li>
            </ul>

            <!-- Right Side Avatar & User Menu -->
            <div class="d-flex align-items-center pt-2 pt-lg-0 border-top border-lg-0 mt-2 mt-lg-0">
                <div class="dropdown">
                    <button class="btn btn-light border-0 dropdown-toggle d-flex align-items-center p-1 pe-3 rounded-pill shadow-xs hover-shadow" 
                            type="button" 
                            id="customerProfileDropdown" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false">
                        <div class="avatar-circle-sm bg-primary text-white rounded-circle fw-bold d-flex align-items-center justify-content-center me-2 shadow-sm" style="width: 38px; height: 38px; font-size: 15px;">
                            <span sec:authentication="name" th:text="${#strings.substring(userFullName ?: 'Customer', 0, 1)}">C</span>
                        </div>
                        <span class="fw-semibold text-dark small me-1" 
                              sec:authentication="name" 
                              th:text="${userFullName ?: 'Phạm Thị Khách Hàng'}">Phạm Thị Khách Hàng</span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 py-2 mt-2" aria-labelledby="customerProfileDropdown" style="min-width: 230px;">
                        <li class="px-3 py-2 border-bottom mb-1 bg-light rounded-top">
                            <small class="text-muted d-block">Xin chào,</small>
                            <strong class="text-primary text-truncate d-block" th:text="${userFullName ?: 'Khách hàng thân thiết'}">Khách hàng thân thiết</strong>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center py-2" href="#" th:href="@{/customer/profile}">
                                <i class="bi bi-person-vcard me-2 text-primary"></i> Hồ sơ cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center py-2" href="#" th:href="@{/change-password}">
                                <i class="bi bi-shield-lock me-2 text-warning"></i> Đổi mật khẩu
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item d-flex align-items-center py-2 text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
