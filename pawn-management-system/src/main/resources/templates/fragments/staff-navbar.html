<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- STAFF NAVBAR FRAGMENT -->
<nav th:fragment="staffNavbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-white shadow-sm border-bottom sticky-top py-2 px-3 app-navbar navbar-light-theme">
    <div class="container-fluid">
        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center me-4 text-decoration-none" href="#" th:href="@{/staff/dashboard}">
            <div class="brand-icon bg-primary text-white rounded-3 p-2 me-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                <i class="bi bi-gem fs-5"></i>
            </div>
            <div>
                <span class="fw-bold text-dark fs-5">PAWN</span><span class="fw-bold text-primary fs-5">MASTER</span>
                <span class="badge bg-primary text-white ms-2 rounded-pill px-2 py-1 fs-8">STAFF CRM</span>
            </div>
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#staffNavbarContent" aria-controls="staffNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Menu Content -->
        <div class="collapse navbar-collapse" id="staffNavbarContent">
            <!-- Center Menu Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-3 fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'dashboard' ? 'active bg-primary text-white' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/staff/dashboard}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-3 fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'contracts' ? 'active bg-primary text-white' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/staff/contracts}">
                        <i class="bi bi-file-earmark-text me-2"></i> Quản lý hợp đồng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-3 fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'collaterals' ? 'active bg-primary text-white' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/staff/collaterals}">
                        <i class="bi bi-box-seam me-2"></i> Tài sản thế chấp
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-3 fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'customers' ? 'active bg-primary text-white' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/staff/customers}">
                        <i class="bi bi-people me-2"></i> Khách hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded-3 fw-medium d-flex align-items-center" 
                       th:classappend="${activePage == 'profile' ? 'active bg-primary text-white' : 'text-dark hover-bg-light'}" 
                       href="#" th:href="@{/staff/profile}">
                        <i class="bi bi-person-badge me-2"></i> Hồ sơ
                    </a>
                </li>
            </ul>

            <!-- Right Profile Section -->
            <div class="d-flex align-items-center pt-2 pt-lg-0 border-top border-lg-0 mt-2 mt-lg-0">
                <div class="dropdown">
                    <button class="btn btn-link text-decoration-none dropdown-toggle d-flex align-items-center p-1 rounded-pill hover-bg-light border-0" 
                            type="button" 
                            id="staffProfileDropdown" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false">
                        <div class="avatar-circle-sm bg-primary text-white rounded-circle fw-bold d-flex align-items-center justify-content-center me-2" style="width: 38px; height: 38px; font-size: 15px;">
                            <span sec:authentication="name" th:text="${#strings.substring(userFullName ?: 'Staff', 0, 1)}">S</span>
                        </div>
                        <div class="text-start me-2 d-none d-sm-block">
                            <div class="fw-semibold text-dark leading-tight small" 
                                 sec:authentication="name" 
                                 th:text="${userFullName ?: 'Lê Thị Nhân Viên'}">Lê Thị Nhân Viên</div>
                            <div class="text-muted fs-8" th:text="${username ?: '@staff'}">@staff</div>
                        </div>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-3 py-2 mt-2" aria-labelledby="staffProfileDropdown" style="min-width: 220px;">
                        <li class="px-3 py-2 border-bottom mb-1 bg-light rounded-top">
                            <div class="fw-semibold text-dark" th:text="${userFullName ?: 'Nhân viên giao dịch'}">Nhân viên giao dịch</div>
                            <small class="text-muted" th:text="${username ?: 'staff@pawnmaster.vn'}">staff@pawnmaster.vn</small>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center py-2" href="#" th:href="@{/staff/profile}">
                                <i class="bi bi-person me-2 text-primary"></i> Hồ sơ cá nhân
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center py-2" href="#" th:href="@{/change-password}">
                                <i class="bi bi-key me-2 text-warning"></i> Đổi mật khẩu
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item d-flex align-items-center py-2 text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
