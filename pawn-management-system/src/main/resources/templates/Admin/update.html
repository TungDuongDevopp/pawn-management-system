<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thêm tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-lg border-0 mx-auto" style="max-width: 550px; border-radius: 15px;">

        <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">Update Account</h3>
        </div>

        <div class="card-body p-4">

            <form method="post"
                  th:action="@{/accounts/update}"
                  th:object="${account}">

                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter username"
                           th:field="*{username}" readonly style="pointer-events: none">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" >Password</label>
                    <input type="password"
                           class="form-control"
                           placeholder="Enter password"
                           th:field="*{password}" readonly style="pointer-events: none" >
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Role</label>

                    <select class="form-select"
                            th:field="*{role}">
                        <option value="">-- Select Role --</option>

                        <option th:each="r : ${T(com.tungduong.pawnmanagementsystem.model.enums.Role).values()}"
                                th:value="${r}"
                                th:text="${r}">
                        </option>

                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Status</label>

                    <select class="form-select"
                            th:field="*{status}">
                        <option value="">-- Select Status --</option>

                        <option th:each="r : ${T(com.tungduong.pawnmanagementsystem.model.enums.AccountStatus).values()}"
                                th:value="${r}"
                                th:text="${r}">
                        </option>

                    </select>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg">
                        Save Account
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
