<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container-fluid p-4">

    <a th:href="@{/categories}" class="btn btn-primary mb-3">
        <i class="bi bi-arrow-left me-1"></i>Quay lại
    </a>

    <div class="card shadow-lg border-0 mx-auto" style="max-width: 550px; border-radius: 15px;">

        <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Thêm danh mục</h3>
        </div>

        <div class="card-body p-4">

            <form method="post"
                  th:action="@{/categories/create}"
                  th:object="${category}">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-tag me-1"></i>Tên danh mục <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           class="form-control"
                           placeholder="Nhập tên danh mục"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"/>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-card-text me-1"></i>Mô tả
                    </label>
                    <textarea class="form-control"
                              rows="4"
                              placeholder="Nhập mô tả danh mục (tuỳ chọn)"
                              th:field="*{description}"></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-check-circle me-1"></i>Lưu danh mục
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
