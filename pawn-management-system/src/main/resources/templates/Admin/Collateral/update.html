<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật tài sản thế chấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .image-preview-wrapper {
            width: 100%;
            height: 180px;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f8f9fa;
            transition: border-color 0.2s;
        }
        .image-preview-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        .image-preview-wrapper .placeholder-text {
            color: #adb5bd;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid p-4">

    <a th:href="@{/collaterals}" class="btn btn-primary mb-3">
        <i class="bi bi-arrow-left me-1"></i>Quay lại
    </a>

    <div class="card shadow-lg border-0 mx-auto" style="max-width: 680px; border-radius: 15px;">

        <div class="card-header bg-warning text-dark text-center py-3">
            <h3 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Cập nhật tài sản thế chấp</h3>
        </div>

        <div class="card-body p-4">

            <form method="post"
                  th:action="@{/collaterals/update}"
                  th:object="${collateral}">

                <input type="hidden" th:field="*{id}">

                <!-- ID (readonly) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-hash me-1"></i>ID
                    </label>
                    <input type="text"
                           class="form-control"
                           th:value="${collateral.id}"
                           readonly
                           style="pointer-events: none; background-color: #f8f9fa;">
                </div>

                <!-- Tên tài sản -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-box-seam me-1"></i>Tên tài sản <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           class="form-control"
                           placeholder="Nhập tên tài sản thế chấp"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"/>
                </div>

                <!-- URL Ảnh -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-image me-1"></i>URL Ảnh <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           id="imageUrlInput"
                           class="form-control"
                           placeholder="https://example.com/image.jpg"
                           th:field="*{imageUrl}"
                           th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid'"
                           oninput="previewImage(this.value)">
                    <span th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" class="invalid-feedback"/>
                    <div class="image-preview-wrapper mt-2" id="imagePreviewBox">
                        <img id="imagePreview"
                             th:src="${collateral.imageUrl}"
                             alt="Preview ảnh"
                             th:style="${collateral.imageUrl != null && !collateral.imageUrl.isEmpty()} ? 'display:block' : 'display:none'">
                        <div class="placeholder-text" id="placeholderText"
                             th:style="${collateral.imageUrl != null && !collateral.imageUrl.isEmpty()} ? 'display:none' : 'display:block'">
                            <i class="bi bi-image fs-3 d-block mb-1"></i>
                            Nhập URL để xem trước ảnh
                        </div>
                    </div>
                </div>

                <!-- Danh mục -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-tags me-1"></i>Danh mục <span class="text-danger">*</span>
                    </label>
                    <select class="form-select"
                            th:field="*{category}"
                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${collateral.category != null && collateral.category.id == cat.id}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="invalid-feedback"/>
                </div>

                <!-- Định giá -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-currency-dollar me-1"></i>Định giá (VNĐ) <span class="text-danger">*</span>
                    </label>
                    <input type="number"
                           class="form-control"
                           placeholder="Nhập giá trị định giá"
                           min="0"
                           step="1000"
                           th:field="*{valuation}"
                           th:classappend="${#fields.hasErrors('valuation')} ? 'is-invalid'">
                    <span th:if="${#fields.hasErrors('valuation')}" th:errors="*{valuation}" class="invalid-feedback"/>
                </div>

                <!-- Trạng thái -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-activity me-1"></i>Trạng thái <span class="text-danger">*</span>
                    </label>
                    <select class="form-select"
                            th:field="*{status}"
                            th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                        <option value="">-- Chọn trạng thái --</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st.name()}"
                                th:text="${st.name() == 'NEW' ? 'Mới' : st.name() == 'LIKENEW' ? 'Như mới' : 'Cũ'}"
                                th:selected="${collateral.status == st}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="invalid-feedback"/>
                </div>

                <!-- Mô tả -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-card-text me-1"></i>Mô tả
                    </label>
                    <textarea class="form-control"
                              rows="3"
                              placeholder="Nhập mô tả tài sản (tuỳ chọn)"
                              th:field="*{description}"></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-warning btn-lg fw-semibold">
                        <i class="bi bi-check-circle me-1"></i>Cập nhật tài sản
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/script/loadImages.js}"></script>

</body>
</html>
