<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="layout">
    <aside th:replace="~{fragments/sidebar :: sidebar(activePage='accounts')}"></aside>

    <main class="content">
        <div class="container-fluid p-4">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">

                    <h3 class="mb-0">
                        Quản lý tài khoản
                    </h3>

                    <a class="btn btn-light fw-semibold"
                       th:href="@{accounts/create}"> <i class="bi bi-plus-lg"></i> Thêm tài khoản
                    </a>

                </div>

                <div class="card-body">

                    <table class="table table-hover align-middle mb-0">

                        <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th>Username</th>
                            <th class="text-center">Role</th>
                            <th class="text-center">Status</th>
                            <th width="180" class="text-center">Action</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:unless="${#lists.isEmpty(accounts)}"  th:each="account : ${accounts}">

                            <td class="text-center"
                                th:text="${account.id}">
                            </td>

                            <td th:text="${account.username}"></td>

                            <td class="text-center">
                                <span class="badge fs-6 px-3 py-2"
                                      th:classappend="' text-bg-' + ${account.role.color}"
                                      th:text="${account.role}">
                                </span>
                            </td>
                            <td class="text-center">
                                <span class="badge fs-6 px-3 py-2"
                                      th:classappend="' text-bg-' + ${account.status.color}"
                                      th:text="${account.status}">
                                </span>
                            </td>

                            <td class="text-center">

                                <a th:href="@{/accounts/{id} (id = ${account.id})}" class="btn btn-warning btn-sm action-btn">
                                    <i class="bi bi-pencil-square"></i>
                                    Sửa
                                </a>
                                <form th:method="delete" th:action="@{/accounts/delete/{id} (id =${account.id})}" style="display: inline-block;">
                                    <button class="btn btn-danger btn-sm action-btn" onclick="return confirm('Bạn có chắc chắn muốn xóa ?')">
                                        <i class="bi bi-trash"></i>
                                        Xóa
                                    </button>
                                </form>


                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="5" class="text-muted py-4">
                                <i class="bi bi-inbox fs-4 d-block mb-2"></i> <!-- Icon hộp trống nếu dùng Bootstrap Icon -->
                                Không có dữ liệu hiển thị.
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
