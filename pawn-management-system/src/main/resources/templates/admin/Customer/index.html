<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar(activePage='customers')}"></aside>

    <main class="content">
        <div class="container-fluid p-4">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">

                    <h3 class="mb-0">
                        Quản lý Khách hàng
                    </h3>

                    <a class="btn btn-light fw-semibold"
                       th:href="@{/customers/create}"> <i class="bi bi-plus-lg"></i> Thêm khách hàng
                    </a>

                </div>

                <div class="card-body">

                    <table class="table table-hover align-middle mb-0">

                        <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-center">Account</th>
                            <th>Name</th>
                            <th>CitizenId</th>
                            <th class="text-center">Email</th>
                            <th class="text-center">Phone</th>
                            <th class="text-center">Address</th>
                            <th width="180" class="text-center">Action</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:unless="${#lists.isEmpty(customers)}"  th:each="customer : ${customers}">

                            <td class="text-center fw-semibold"
                                th:text="${customer.id}">
                            </td>
                            <td class="text-center fw-semibold" th:text="${customer.account != null ? customer.account.username : 'N/A'}"></td>

                            <td  th:text="${customer.name}"></td>
                            <td th:text="${customer.citizenId}"></td>
                            <td th:text="${customer.email}"></td>
                            <td th:text="${customer.phone}"></td>
                            <td th:text="${customer.address}"></td>

                            <td class="text-center">
                                <div class="action">
                                    <a th:href="@{/customers/{id} (id = ${customer.id})}" class="btn btn-warning btn-sm action-btn">
                                        <i class="bi bi-pencil-square"></i>
                                        Sửa
                                    </a>
                                    <form th:method="delete" th:action="@{/customers/delete/{id} (id =${customer.id})}" style="display: inline-block;">
                                        <button class="btn btn-danger btn-sm action-btn" onclick="return confirm('Bạn có chắc chắn muốn xóa ?')">
                                            <i class="bi bi-trash"></i>
                                            Xóa
                                        </button>
                                    </form>

                                </div>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(customers)}">
                            <td colspan="6" class="text-muted py-4">
                                <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                                Không có dữ liệu hiển thị.
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
