<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="layout">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar(activePage='categories')}"></aside>

    <main class="content">
        <div class="container-fluid p-4">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">

                    <h3 class="mb-0">
                        <i class="bi bi-tags-fill me-2"></i>Quản lý danh mục
                    </h3>

                    <a class="btn btn-light fw-semibold"
                       th:href="@{/categories/create}">
                        <i class="bi bi-plus-lg"></i> Thêm danh mục
                    </a>

                </div>

                <div class="card-body">

                    <table class="table table-hover align-middle mb-0">

                        <thead>
                        <tr>
                            <th class="text-center" style="width: 80px;">ID</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th width="180" class="text-center">Thao tác</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:unless="${#lists.isEmpty(categories)}" th:each="category : ${categories}">

                            <td class="text-center fw-semibold"
                                th:text="${category.id}">
                            </td>

                            <td>
                                <span class="fw-semibold" th:text="${category.name}"></span>
                            </td>

                            <td class="text-muted" th:text="${category.description != null && !category.description.isEmpty() ? category.description : '—'}">
                            </td>

                            <td class="text-center">
                                <div class="action">
                                    <a th:href="@{/categories/{id} (id = ${category.id})}" class="btn btn-warning btn-sm action-btn">
                                        <i class="bi bi-pencil-square"></i>
                                        Sửa
                                    </a>
                                    <form th:method="delete" th:action="@{/categories/delete/{id} (id =${category.id})}" style="display: inline-block;">
                                        <button class="btn btn-danger btn-sm action-btn" onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này ?')">
                                            <i class="bi bi-trash"></i>
                                            Xóa
                                        </button>
                                    </form>
                                </div>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="4" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                Chưa có danh mục nào. Hãy thêm danh mục mới!
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
