<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <a th:href="@{/staffs}" class="btn btn-primary mb-3">Quay lại</a>
    <div class="card shadow-lg border-0 mx-auto" style="max-width: 650px; border-radius: 15px;">

        <div class="card-header bg-primary text-white text-center py-3">
            <h3 class="mb-0">Thêm nhân viên mới</h3>
        </div>

        <div class="card-body p-4">

            <form method="post"
                  th:action="@{/staffs/create}"
                  th:object="${staff}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tài khoản</label>
                    <select class="form-select" th:field="*{account}"
                            th:classappend="${#fields.hasErrors('account')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn tài khoản --</option>
                        <option th:each="acc : ${@accountService.getAllAccounts()}"
                                th:value="${acc.id}"
                                th:text="${acc.username}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{account}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Họ và tên</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Nhập họ và tên"
                           th:field="*{fullname}"
                           th:classappend="${#fields.hasErrors('fullname')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{fullname}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Nhập email"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Điện thoại</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Nhập số điện thoại (ví dụ: 0912345678)"
                           th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Địa chỉ</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Nhập địa chỉ"
                           th:field="*{address}"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Phòng ban</label>
                    <select class="form-select" th:field="*{deparment}"
                            th:classappend="${#fields.hasErrors('deparment')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn phòng ban --</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept}"
                                th:text="${dept}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{deparment}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Chức vụ</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Nhập chức vụ"
                           th:field="*{position}"
                           th:classappend="${#fields.hasErrors('position')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{position}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Ngày tuyển dụng</label>
                    <input type="date"
                           class="form-control"
                           th:field="*{hireDate}"
                           th:classappend="${#fields.hasErrors('hireDate')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{hireDate}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Lương (VNĐ)</label>
                    <input type="number"
                           class="form-control"
                           placeholder="Nhập mức lương (từ 1,000,000)"
                           th:field="*{salary}"
                           th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{salary}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Trạng thái</label>
                    <select class="form-select" th:field="*{status}"
                            th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn trạng thái --</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{status}"></div>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg">
                        Lưu Nhân viên
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
